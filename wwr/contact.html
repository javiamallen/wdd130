    <meta name="description"
      content="Welcome to our rafting site! Discover thrilling rafting adventures, safety tips, and the best locations for an unforgettable experience.">

    <header>

    <main>
        <h1></h1>
        <form>
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Subject" required>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" placeholder="Your Message" required></textarea>

        </form>
       
        </section>

        <section class="adventures">
            <h2>Adventure Awaits You!</h2>
            <p>Meet the exciting trips and rapid challenges we offer:</p>
            <div class="adventure-grid">
                <figure>
                    <img src="images/rapid1.jpg" alt="Los Dientes del Diablo rapid">
                    <figcaption>Los Dientes del Diablo</figcaption>
                </figure>
                <figure>
                    <img src="images/rapid2.jpg" alt="Big Mallard rapid">
                    <figcaption>Big Mallard</figcaption>
                </figure>
                <figure>
                    <img src="images/trip1.jpg" alt="Half Day Adventure trip">
                    <figcaption>Half Day Adventure</figcaption>
                </figure>
                <figure>
                    <img src="images/trip2.jpg" alt="Full Day Expedition trip">
                    <figcaption>Full Day Expedition</figcaption>
                </figure>
                <figure>
                    <img src="images/rapid3.jpg" alt="Thunder Gorge rapid">
                    <figcaption>Thunder Gorge</figcaption>
                </figure>
            </div>
        </section>
